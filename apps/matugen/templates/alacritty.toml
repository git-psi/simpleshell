# Generated by simpleshell (apps/matugen): rewritten on every theme change.
# Terminal colors tinted toward the accent by matugen; yellow is the accent itself (it's the
# highlight color of fastfetch, starship…). In dark mode, "normal" = mid tone and "bright" = light
# tone; in light mode, "normal" = dark tone.
[colors.primary]
background = "{{hs.bg}}"
foreground = "{{hs.text}}"

[colors.cursor]
cursor = "{{hs.accent}}"
text = "{{hs.ink}}"

[colors.selection]
background = "{{hs.accent}}"
text = "{{hs.ink}}"

[colors.search.matches]
background = "{{hs.hi}}"
foreground = "{{hs.text}}"

[colors.search.focused_match]
background = "{{hs.accent}}"
foreground = "{{hs.ink}}"

<* if {{ is_dark_mode }} *>
[colors.normal]
black = "{{hs.hi}}"
red = "{{colors.red_container.default.hex}}"
green = "{{colors.green_container.default.hex}}"
yellow = "{{colors.primary_container.default.hex}}"
blue = "{{colors.blue_container.default.hex}}"
magenta = "{{colors.magenta_container.default.hex}}"
cyan = "{{colors.cyan_container.default.hex}}"
white = "{{hs.text}}"

[colors.bright]
black = "{{hs.dim}}"
red = "{{colors.red.default.hex}}"
green = "{{colors.green.default.hex}}"
yellow = "{{colors.primary.default.hex}}"
blue = "{{colors.blue.default.hex}}"
magenta = "{{colors.magenta.default.hex}}"
cyan = "{{colors.cyan.default.hex}}"
white = "{{hs.text}}"
<* else *>
[colors.normal]
black = "{{hs.text}}"
red = "{{colors.red.default.hex}}"
green = "{{colors.green.default.hex}}"
yellow = "{{colors.primary.default.hex}}"
blue = "{{colors.blue.default.hex}}"
magenta = "{{colors.magenta.default.hex}}"
cyan = "{{colors.cyan.default.hex}}"
white = "{{hs.dim}}"

[colors.bright]
black = "{{hs.dim}}"
red = "{{colors.red_container.default.hex}}"
green = "{{colors.green_container.default.hex}}"
yellow = "{{colors.primary_container.default.hex}}"
blue = "{{colors.blue_container.default.hex}}"
magenta = "{{colors.magenta_container.default.hex}}"
cyan = "{{colors.cyan_container.default.hex}}"
white = "{{hs.hi}}"
<* endif *>
