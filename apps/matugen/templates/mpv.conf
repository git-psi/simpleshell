# Generated by simpleshell (apps/matugen): rewritten on every theme change.
# Included from ~/.config/mpv/mpv.conf. Messages and the volume/seek bar in simpleshell's style:
# Ubuntu font, text on a solid panel-colored box, accent bar.
osd-font="Ubuntu"
osd-font-size=30
osd-bold=yes
osd-color="{{hs.text}}"
osd-border-style=background-box
osd-back-color="{{hs.bg}}"
osd-outline-color="{{hs.bg}}"
osd-margin-x=28
osd-margin-y=28
osd-bar-align-y=0.85
osd-bar-h=2
osd-selected-color="{{hs.accent}}"
