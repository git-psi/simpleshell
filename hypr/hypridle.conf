# simpleshell — idle handling (hypridle). The shell (power/Idle.qml) runs hypridle on
# ~/.local/state/simpleshell/hypridle.conf: this file, plus the delays picked in Settings > Idle. The
# Caffeine tile (systemd-inhibit) and fullscreen videos (Firefox, mpv…) prevent it from firing.

general {
    lock_cmd = pidof hyprlock || hyprlock          # loginctl lock-session (Lock)
    # SDDM hands the session back (ReuseSession) and unlocks it through logind: power/unlock.sh
    # closes hyprlock and turns the screens back on (turned off by hypridle while on SDDM).
    unlock_cmd = ~/.config/quickshell/simpleshell/power/unlock.sh
    # Idle lock (power/Idle.qml) and before suspend: lock then SDDM login screen (power/greeter.sh),
    # to wake up straight on SDDM.
    # Logging back in, SDDM reopens this session.
    before_sleep_cmd = ~/.config/quickshell/simpleshell/power/greeter.sh
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Waits for hyprlock to show before suspending.
    inhibit_sleep = 3
}
