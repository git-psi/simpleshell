# simpleshell — hidden lock (hyprlock), started by power/greeter.sh right before switching to SDDM:
# a plain black screen, so the regular lock screen never flashes by. SDDM unlocks the session on
# return (power/unlock.sh closes it). If SDDM doesn't show up, the password still works: the field
# only appears while typing.
source = ~/.local/state/simpleshell/hyprlock-colors.conf
$font = Ubuntu

general {
    hide_cursor = true
    ignore_empty_input = true   # see hyprlock.conf
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(000000ff)
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 14
    inner_color = $surface
    outer_color = $hi
    check_color = $accent
    fail_color = $danger
    font_color = $text
    font_family = $font
    placeholder_text =
    fade_on_empty = true
    fade_timeout = 0
    position = 0, -20
    halign = center
    valign = center
}
