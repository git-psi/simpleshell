# simpleshell — lock screen (hyprlock). Linked into ~/.config/hypr:
#   ln -s ~/.config/quickshell/simpleshell/hypr/hyprlock.conf ~/.config/hypr/hyprlock.conf
# simpleshell's colors (accent, grays), written by apps/theme.sh.
source = ~/.local/state/simpleshell/hyprlock-colors.conf
$font = Ubuntu

general {
    hide_cursor = true
    # Keys pressed to wake the screen (Enter, Space…) don't count as an attempt: 3 failures lock
    # the account for 10 min (pam_faillock), even with the right password.
    ignore_empty_input = true
}

animations {
    enabled = true
    # Same curves and speeds as the shell and the windows (simpleshell.lua).
    bezier = out, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 2, out
    animation = fadeOut, 1, 1.4, out
    animation = inputFieldDots, 1, 1.4, out
}

# The desktop blurred and darkened behind.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Time and date above the field.
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font Medium
    color = $text
    position = 0, 160
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    font_size = 18
    font_family = $font
    color = $dim
    position = 0, 70
    halign = center
    valign = center
}

# Password: accent outline, red when rejected.
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 14
    inner_color = $surface
    outer_color = $hi
    check_color = $accent
    fail_color = $danger
    font_color = $text
    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}
